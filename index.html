<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <form>

     <div>
      <label>User Name</label>
      <input type="User Name" placeholder="Your User Name.." required>
        </div>
    <div>
      <label>Email</label>
      <input type="email" placeholder="Your Email.." required>
    </div>

    <div class="pass-wrapper">
      <label>Password</label>

      <!-- تم تحديد الحقل بين 8 و20 حرفاً من خلال maxlength -->
      <div class="input-box">
        <input type="password" required id="password" placeholder="Your Password.." maxlength="20">
        <i class="fa-solid fa-eye-slash toggle-pass"></i>
      </div>

      <!-- شريط قياس القوة والنص -->
      <div class="strength-meter">
        <div class="strength-bar" id="strengthBar"></div>
      </div>
      <p class="strength-text" id="strengthText"></p>
    </div>

    <button type="submit">Login</button>
  </form>

  <script src="js/script.js"></script>
</body>

</html>
